<!doctype html><html><head><meta charset="utf-8">
<style>
  /* A strip of consecutive frames, stacked. One browser launch draws all of
     them; ffmpeg cuts the screenshot back into individual frames. */
  *{margin:0;padding:0}
  html,body{width:1920px;background:#131313}
  iframe{display:block;width:1920px;height:1080px;border:0}
</style></head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const page = q.get('page');
  const start = Number(q.get('start') || 0);
  const count = Number(q.get('count') || 1);
  const n = Number(q.get('n') || 1);
  for (let i = 0; i < count; i++) {
    const f = document.createElement('iframe');
    f.src = page + '?f=' + (start + i) + '&n=' + n;
    f.setAttribute('scrolling', 'no');
    document.body.appendChild(f);
  }
</script></body></html>
